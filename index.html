<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوق مادور | سوق الشرق</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
header{background:#0f172a;padding:16px;text-align:center;border-bottom:1px solid #222}
header h1{margin:0;color:#facc15;font-size:26px}
header p{color:#ddd;margin:6px 0 0}
#adminBtn{display:none;background:#facc15;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;position:fixed;bottom:15px;left:15px;z-index:99;cursor:pointer}
.search{padding:12px} .search input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#1e293b;color:#fff;font-size:16px}
.filters{display:flex;gap:10px;padding:0 12px} .filters select{flex:1;padding:11px;border-radius:12px;background:#1e293b;color:#fff;border:1px solid #333}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#1e293b;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:150px;object-fit:cover} .card-body{padding:10px;display:flex;flex-direction:column;flex-grow:1;justify-content:space-between}
.price{color:#facc15;font-weight:bold;margin:4px 0} .card button{width:100%;padding:10px;border:none;background:#facc15;border-radius:10px;margin-top:8px;font-weight:bold;color:#000;cursor:pointer}
.delBtn{background:#ef4444 !important;color:#fff !important}
.addBtn{display:block;margin:10px 12px;padding:14px;background:#1e293b;border-radius:14px;text-align:center;font-weight:bold;border:1px dashed #facc15;color:#facc15}
#adminPanel{display:none;background:#fff;color:#000;margin:12px;padding:14px;border-radius:14px}
#adminPanel input,#adminPanel select{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
#adminPanel button{background:#111;color:#fff;padding:11px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer;margin-top:5px}
</style>
</head>
<body>
<header><h1>🛒 سوق مادور - سوق الشرق</h1><p>بيع و اشري في عنابة و الشرق</p></header>
<div class="search"><input id="search" placeholder="🔍 حوس على سلعة..." oninput="filterAndRender()"></div>
<div class="filters">
<select id="categoryFilter" onchange="filterAndRender()"><option value="الكل">كل التصنيفات</option><option value="ملابس">ملابس</option><option value="هواتف">هواتف</option><option value="ساعات">ساعات</option><option value="سيارات">سيارات</option></select>
<select id="sortFilter" onchange="filterAndRender()"><option value="الجديد">🕒 الجديد أولاً</option><option value="رخيص">📉 الأقل سعراً</option><option value="غالي">📈 الأعلى سعراً</option></select>
</div>
<button id="adminBtn" onclick="toggleAdmin()">⚙️ لوحة التحكم</button>
<div id="adminPanel">
<h3>⚙️ لوحة التحكم - خاصة بك</h3>
<input id="pName" placeholder="اسم السلعة">
<input id="pPrice" type="number" placeholder="السعر (دج)">
<select id="pCategory"><option value="ملابس">ملابس</option><option value="هواتف">هواتف</option><option value="ساعات">ساعات</option><option value="سيارات">سيارات</option></select>
<input id="pImg" placeholder="رابط الصورة (اختياري)">
<button onclick="addProduct()">+ زيد سلعة</button>
<button onclick="logout()" style="background:#ef4444;color:#fff">خروج من الحساب</button>
</div>
<div class="products" id="list"></div>
<div class="addBtn">➕ زيد إعلان جديد - تواصل مع صاحب الموقع</div>
<script>
if(window.location.search.includes('admin=madour')){
  let password = prompt('أدخل كلمة السر:');
  if(password === 'madour123'){ localStorage.setItem('isAdmin','1'); alert('مرحبا بيك يا أدمن! ✅'); window.location.href = window.location.origin + window.location.pathname; }
  else { alert('كلمة السر خاطئة! ❌'); }
}
if(localStorage.getItem('isAdmin') === '1'){ document.getElementById('adminBtn').style.display = 'block'; }
function toggleAdmin(){ let p=document.getElementById('adminPanel'); p.style.display = p.style.display==='block'?'none':'block'; }
function logout(){ localStorage.removeItem('isAdmin'); alert('تم الخروج'); location.reload(); }
let defaultProducts = [
{id:1,name:"حذاء رياضي نايك",price:4500,category:"ملابس",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
{id:2,name:"هاتف آيفون ذكي",price:25000,category:"هواتف",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"},
{id:3,name:"ساعة يد عصرية",price:8000,category:"ساعات",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"},
{id:4,name:"جاكيت جلد أسود",price:6500,category:"ملابس",img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600"}
];
let products = JSON.parse(localStorage.getItem('myProducts')) || defaultProducts;
let isAdmin = localStorage.getItem('isAdmin')==='1';
function filterAndRender(){
  let s=document.getElementById('search').value.toLowerCase();
  let c=document.getElementById('categoryFilter').value;
  let sort=document.getElementById('sortFilter').value;
  let f=products.filter(p=>p.name.toLowerCase().includes(s) && (c==="الكل"||p.category===c));
  if(sort==="رخيص") f.sort((a,b)=>a.price-b.price);
  else if(sort==="غالي") f.sort((a,b)=>b.price-a.price);
  else f.sort((a,b)=>b.id-a.id);
  let list=document.getElementById('list');
  if(f.length===0){ list.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px">مكانش سلع تطابق البحث تاعك.</p>'; return; }
  list.innerHTML=f.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.name}</b><div class="price">${p.price} دج</div><button onclick="alert('اتصل بالبائع: ${p.name}')">شوف التفاصيل</button>${isAdmin?`<button class="delBtn" onclick="deleteProduct(${p.id})">🗑️ حذف</button>`:''}</div></div>`).join('');
}
function addProduct(){
  let n=document.getElementById('pName').value;
  let p=document.getElementById('pPrice').value;
  let c=document.getElementById('pCategory').value;
  let i=document.getElementById('pImg').value;
  if(!n||!p) return alert('عمر الاسم والسعر!');
  products.unshift({id:Date.now(),name:n,price:Number(p),category:c,img:i||'https://via.placeholder.com/500?text='+encodeURIComponent(n)});
  localStorage.setItem('myProducts',JSON.stringify(products));
  filterAndRender();
  document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImg').value='';
  alert('تزادت ✅');
}
function deleteProduct(id){ if(!confirm('تحذف هذي السلعة؟')) return; products=products.filter(p=>p.id!==id); localStorage.setItem('myProducts',JSON.stringify(products)); filterAndRender(); }
filterAndRender();
</script>
</body>
</html>
