<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق مادور - عنابة</title>
<style>
body{margin:0;background:#0f172a;color:#fff;padding:15px;font-family:system-ui}
header{text-align:center;background:#1e293b;padding:25px;border-radius:20px;margin-bottom:20px}
header h1{color:#facc15;margin:0}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.top input,.top select{flex:1;padding:14px;border-radius:12px;background:#1e293b;color:#fff;border:1px solid #333}
.top button{padding:14px;background:#facc15;border:none;border-radius:12px;font-weight:bold}
#ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:#1e293b;border-radius:20px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:16px}
.price{color:#22c55e;font-weight:800;font-size:22px;margin:10px 0}
.card a{display:block;background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold}
.form{background:#1e293b;padding:20px;border-radius:20px;margin-top:30px}
.form input,.form select,.form textarea{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;background:#00000033;color:#fff;border:1px solid #333;box-sizing:border-box}
.form button{width:100%;padding:14px;background:#facc15;border:none;border-radius:12px;font-weight:bold}
.admin{background:#1e293b;border:2px solid #facc15;padding:20px;border-radius:20px;margin-top:20px}
#adminPanel{display:none}
</style>
</head>
<body>
<header><h1>🛒 سوق مادور - سوق الشرق</h1><p>بيع و اشري في عنابة و الشرق - الإعلانات حقيقية و تظهر للجميع</p><p id="status" style="font-size:13px;color:#facc15">⏳ جاري التحميل...</p></header>
<div class="top">
<input id="search" placeholder="🔍 حوس..." oninput="renderMarket()">
<select id="filterCat" onchange="renderMarket()"><option value="">كل التصنيفات</option><option value="سيارات">سيارات</option><option value="هواتف">هواتف</option><option value="عقارات">عقارات</option><option value="ملابس">ملابس</option><option value="اخرى">اخرى</option></select>
<select id="sortPrice" onchange="renderMarket()"><option value="">ترتيب عشوائي</option><option value="low">الأقل سعرا</option><option value="high">الأعلى سعرا</option></select>
<button onclick="showAdmin()">⚙️ لوحة التحكم</button>
</div>
<div id="ads"></div>
<div class="form">
<h2>➕ زيد إعلان جديد</h2>
<input id="form-title" placeholder="اسم السلعة">
<input type="number" id="form-price" placeholder="السعر بالدينار">
<select id="form-cat"><option>سيارات</option><option>هواتف</option><option>عقارات</option><option>ملابس</option><option>اخرى</option></select>
<input id="form-location" placeholder="المكان - عنابة، البوني">
<input type="number" id="form-phone" placeholder="واتساب بدون صفر - 551234567">
<input type="file" id="form-file" accept="image/*" onchange="previewImage(event)">
<textarea id="form-desc" rows="3" placeholder="وصف السلعة..."></textarea>
<button onclick="addAd()">إرسال للمراجعة 📤</button>
</div>
<div class="admin" id="adminPanel"><h3>لوحة التحكم</h3><h4>⏳ انتظار:</h4><div id="pendingList"></div><h4>✅ نشطة:</h4><div id="approvedList"></div><button onclick="hideAdmin()" style="width:100%;padding:12px;margin-top:15px">إغلاق</button></div>
<script>
const API="https://getpantry.cloud/apiv1/pantry/mador-market-annaba-2026/basket/ads";
let ads=[]; let tempImg="";
async function loadAds(){
  try{
    let r=await fetch(API); let j=await r.json();
    if(j && j.ads && Array.isArray(j.ads)){ads=j.ads;}
    else{ads=[
      {id:1,title:"iPhone 13 Pro",price:125000,cat:"هواتف",location:"عنابة - وسط",phone:"551234567",desc:"نظيف بزاف، معاه كلش",img:"https://via.placeholder.com/400x300?text=iPhone",status:"approved"},
      {id:2,title:"سيارة Clio 4",price:1850000,cat:"سيارات",location:"البوني",phone:"551234567",desc:"ماشية 120 ألف، نظيفة",img:"https://via.placeholder.com/400x300?text=Clio",status:"approved"}
    ]; await saveAds();}
    document.getElementById('status').textContent="✅ متصل - "+ads.filter(a=>a.status==="approved").length+" إعلان نشط";
  }catch(e){ ads=JSON.parse(localStorage.getItem('mador_ads')||'[]'); document.getElementById('status').textContent="⚠️ وضع بدون انترنت"; }
  renderMarket();
}
async function saveAds(){
  localStorage.setItem('mador_ads',JSON.stringify(ads));
  try{ await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ads:ads})}); }catch(e){}
}
function previewImage(e){
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader();
  r.onload=function(){ let img=new Image(); img.onload=function(){ let c=document.createElement('canvas'); let w=800; let h=img.height*800/img.width; c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); tempImg=c.toDataURL('image/jpeg',0.7); }; img.src=r.result; }; r.readAsDataURL(file);
}
function renderMarket(){
  let s=document.getElementById('search').value.toLowerCase();
  let c=document.getElementById('filterCat').value;
  let sort=document.getElementById('sortPrice').value;
  let list=ads.filter(a=>a.status==="approved"&&a.title.toLowerCase().includes(s)&&(!c||a.cat===c));
  if(sort==="low")list.sort((a,b)=>a.price-b.price);
  if(sort==="high")list.sort((a,b)=>b.price-a.price);
  document.getElementById('ads').innerHTML=list.map(a=>`<div class="card"><img src="${a.img||'https://via.placeholder.com/400x300?text=No+Image'}"><div class="card-body"><h3>${a.title}</h3><p>📍 ${a.location} | ${a.cat}</p><p>${a.desc||''}</p><div class="price">${a.price} دج</div><a href="https://wa.me/213${a.phone}" target="_blank">واتساب 💬</a></div></div>`).join('')||"<p>لا توجد إعلانات</p>";
}
async function addAd(){
  let t=document.getElementById('form-title').value.trim();
  let p=document.getElementById('form-price').value;
  let ph=document.getElementById('form-phone').value.trim();
  if(!t||!p||!ph){alert("عمر الاسم و السعر و الواتساب");return;}
  ads.push({id:Date.now(),title:t,price:Number(p),cat:document.getElementById('form-cat').value,location:document.getElementById('form-location').value||"عنابة",phone:ph,desc:document.getElementById('form-desc').value,img:tempImg,status:"pending"});
  await saveAds(); alert("تم الإرسال للمراجعة ✅"); location.reload();
}
function showAdmin(){
  let pass=prompt("كلمة السر:"); if(pass!=="1234"){alert("غلط");return;}
  document.getElementById('adminPanel').style.display="block";
  document.getElementById('pendingList').innerHTML=ads.filter(a=>a.status==="pending").map(a=>`<div style="background:#00000055;padding:10px;border-radius:10px;margin:5px">${a.title} - ${a.price} دج <button onclick="approveAd(${a.id})" style="background:#22c55e;color:#fff;border:none;padding:6px 10px;border-radius:8px">قبول</button> <button onclick="deleteAd(${a.id})" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:8px">حذف</button></div>`).join('')||"لا يوجد";
  document.getElementById('approvedList').innerHTML=ads.filter(a=>a.status==="approved").map(a=>`<div style="background:#00000055;padding:10px;border-radius:10px;margin:5px">${a.title} <button onclick="deleteAd(${a.id})" style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:8px">حذف</button></div>`).join('');
}
function hideAdmin(){document.getElementById('adminPanel').style.display="none";}
async function approveAd(id){let a=ads.find(x=>x.id===id);a.status="approved";await saveAds();showAdmin();renderMarket();}
async function deleteAd(id){ads=ads.filter(x=>x.id!==id);await saveAds();showAdmin();renderMarket();}
loadAds();
</script>
</body>
</html>
